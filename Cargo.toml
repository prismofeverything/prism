[workspace]
resolver = "2"
members = [
    "crates/prism-schema",
    "crates/prism-bigraph",
    "crates/prism-viz",
    "crates/prism-derive",
    "crates/prism-mapk",
    "crates/prism-std",
    "crates/prism-trace",
    "crates/spatio-flux",
    "crates/chrysalis",
    "crates/coda",
    "crates/prism-audio",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/prismofeverything/prism"

[workspace.dependencies]
prism-schema = { path = "crates/prism-schema" }
prism-bigraph = { path = "crates/prism-bigraph" }
prism-viz = { path = "crates/prism-viz" }
prism-derive = { path = "crates/prism-derive" }
prism-mapk = { path = "crates/prism-mapk" }
prism-std = { path = "crates/prism-std" }
prism-trace = { path = "crates/prism-trace" }
spatio-flux = { path = "crates/spatio-flux" }
chrysalis = { path = "crates/chrysalis" }
coda = { path = "crates/coda" }
prism-audio = { path = "crates/prism-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
petgraph = "0.7"
rand = "0.8"
highs = "2.0"
highs-sys = "1.12"
compact_str = { version = "0.9", features = ["serde"] }
rapier2d = { version = "0.22", features = [] }

# ── Build profile — multi-agent disk hygiene ──────────────────────────────────
# prism builds MANY binaries (93 chrysalis integration-test files alone, each a
# separate binary linking the whole workspace) into ONE shared target/ that several
# agents fill at once. The default `debug = 2` (full DWARF symbols) is the bulk of
# each binary's size — at 93+ test binaries it ballooned target/ to 64G and filled
# the disk. `line-tables-only` keeps panic/backtrace LINE NUMBERS while cutting
# binary size ~50%+; incremental is dropped (~6G of cache that doesn't help across
# agents — one agent's edit to a shared crate invalidates it anyway). test/example
# builds inherit this. NOT a rustflags/linker override, so it won't trigger repeated
# whole-tree rebuilds — only editing this block does.
[profile.dev]
debug = "line-tables-only"
incremental = false
