[workspace]
resolver = "2"
members = [
    "crates/prism-schema",
    "crates/prism-bigraph",
    "crates/prism-viz",
    "crates/prism-derive",
    "crates/prism-mapk",
    "crates/prism-std",
    "crates/prism-trace",
    "crates/spatio-flux",
    "crates/chrysalis",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/prismofeverything/prism"

[workspace.dependencies]
prism-schema = { path = "crates/prism-schema" }
prism-bigraph = { path = "crates/prism-bigraph" }
prism-viz = { path = "crates/prism-viz" }
prism-derive = { path = "crates/prism-derive" }
prism-mapk = { path = "crates/prism-mapk" }
prism-std = { path = "crates/prism-std" }
prism-trace = { path = "crates/prism-trace" }
spatio-flux = { path = "crates/spatio-flux" }
chrysalis = { path = "crates/chrysalis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
petgraph = "0.7"
rand = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
highs = "2.0"
highs-sys = "1.12"
compact_str = { version = "0.9", features = ["serde"] }
rapier2d = { version = "0.22", features = [] }
