[package]
name = "prism-audio"
description = "prism's audio / modular-synthesis layer — Signal blocks, modules, offline render (A1). See docs/synthesis-bigraphs.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
prism-schema = { workspace = true }
prism-bigraph = { workspace = true }
indexmap = { workspace = true }
# The lock-free ring is the device-boundary seam (engine thread ↔ audio thread).
# Pure Rust, no system libs — so the engine→ring pump and its test build anywhere.
ringbuf = "0.4"
# The realtime device + network layer (A3/A8). Optional: these pull cpal, which
# needs system audio libs (ALSA), so the offline render path (A1/A2/A5) never
# requires them. cpal/anyhow are used directly by the run_realtime driver.
gorgon = { path = "../../../gorgon", optional = true }
cpal = { version = "0.15", optional = true }
anyhow = { version = "1", optional = true }
# The standard runtime (std processes/methods). SUBSTRATE, not the language — so
# the audio domain's `Core` (`audio_core`) is built without chrysalis: the audio
# features are independent of the language.
prism-std = { workspace = true }
# The `.ys` LANGUAGE facet only (the import surface + running a `.ys` program).
# Optional: prism-audio's library never deps the language; only the thin runner
# facet behind `--features ys` does. (chrysalis stays downstream of the domain.)
chrysalis = { workspace = true, optional = true }

[features]
# Enable the cpal device boundary + the `play` example: `--features realtime`.
realtime = ["dep:gorgon", "dep:cpal", "dep:anyhow"]
# Enable the `.ys` language facet: `audio_modules()` + run via
# `chrysalis::runner::run_with_core`. `audio_core()` is NOT gated — it is
# chrysalis-free substrate (`--features ys` only adds the language integration).
ys = ["dep:chrysalis"]

[[example]]
name = "play"
required-features = ["realtime"]

# Hear the synth WRITE a synth — the stack_factory authors a detuned stack live
# (the audible twin of packages/synth/ys/writes-synths.ys).
[[example]]
name = "play_writes_synths"
required-features = ["realtime"]

# Hear a `.ys` PATCH — compile a package's continuous audio engine and drive it to
# the device (the `.ys` → audible seam). Needs the language facet too.
[[example]]
name = "play_ys"
required-features = ["realtime", "ys"]
