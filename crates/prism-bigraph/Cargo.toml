[package]
name = "prism-bigraph"
description = "Composable multi-scale simulation engine based on process bigraphs"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
prism-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
ordered-float = { workspace = true }
compact_str = { workspace = true }
petgraph = { workspace = true }
rand = { workspace = true }
# Lightweight HTTP client for the `rest` protocol. Default features
# disabled to keep deps slim — no TLS pulled in for tier 1 (localhost
# REST servers). Add a "tls" feature later if remote HTTPS is needed.
ureq = { version = "2", default-features = false, features = ["json"] }
