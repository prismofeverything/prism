[project]
name = "prism-process-server"
version = "0.1.0"
description = "Hosts simulation processes (native integrators today; COPASI/Tellurium next) over prism's rest protocol — the typed seam between the Rust engine and Python simulators. Ports are reported as bigraph-schema type strings so prism reconstructs the real Schema across the bridge."
requires-python = ">=3.10"
# No deps for the native seam (stdlib http.server). The COPASI/Tellurium
# wrappers add `basico` (python-copasi) and/or `libroadrunner`/`tellurium`.
dependencies = [
    "copasi-basico>=0.86",
    "libroadrunner>=2.9.2",
]

[tool.uv]
# This is an application, not a library — uv manages the venv + deps, doesn't
# build/install the project itself.
package = false
